# Execution through the existing standalone master.
spark.master spark://sparkvm-test:7077
spark.submit.deployMode client

# Use the existing Python environment for driver and Python workers.
spark.pyspark.python /home/ubuntu/spark-env/bin/python
spark.pyspark.driver.python /home/ubuntu/spark-env/bin/python

# Resource allocation for the project Spark session.
spark.cores.max 2
spark.executor.cores 2
spark.executor.memory 1g
spark.driver.memory 1g
spark.dynamicAllocation.enabled false
