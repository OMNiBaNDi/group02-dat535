name: Final project - Development

on:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  development-fixture:
    name: Development pipeline
    runs-on: [self-hosted, linux, X64]
    timeout-minutes: 15

    defaults:
      run:
        shell: bash

    env:
      JAVA_HOME: /usr/lib/jvm/java-8-openjdk-amd64
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out this revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run configuration tests
        run: |
          /home/ubuntu/spark-env/bin/python -B -m unittest discover \
            -s final_project/tests \
            -p 'test_*.py' \
            -v

      - name: Run development fixture
        id: fixture
        run: |
          bash final_project/scripts/run_fixture.sh --environment dev

      - name: Run Bronze, Silver and Gold notebook
        id: notebook
        run: |
          bash final_project/scripts/run_notebook.sh --environment dev

      - name: Upload this run's logs and reports
        if: ${{ !cancelled() && steps.fixture.outputs.run_root != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: cp1-dev-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.fixture.outputs.run_root }}/logs/
            ${{ steps.fixture.outputs.run_root }}/reports/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Bronze reports and executed notebook
        if: ${{ !cancelled() && steps.notebook.outputs.run_root != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: notebook-dev-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.notebook.outputs.run_root }}/reports/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Silver and Gold reports
        if: ${{ !cancelled() && steps.notebook.outputs.silver_reports_dir != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: silver-gold-dev-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.notebook.outputs.silver_reports_dir }}
          if-no-files-found: error
          retention-days: 30