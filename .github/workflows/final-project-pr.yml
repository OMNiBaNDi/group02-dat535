name: Final project - Pull request

# Check a proposed merge into main before it is accepted.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-fixture:
    # Keep the existing check name for any branch-protection requirements.
    name: PR fixture
    # Only run this self-hosted job for dev PRs from our own repository.
    if: >-
      github.head_ref == 'dev' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, X64]
    timeout-minutes: 15

    defaults:
      run:
        shell: bash

    env:
      JAVA_HOME: /usr/lib/jvm/java-8-openjdk-amd64
      PYTHONDONTWRITEBYTECODE: "1"
      # Give each attempt its own test folder, separate from dev and prod data.
      TEST_RUN_ID: pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Check out the proposed merge revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run configuration tests
        run: |
          /home/ubuntu/spark-env/bin/python -B -m unittest discover \
            -s final_project/tests \
            -p 'test_*.py' \
            -v

      # Made-up Gold inputs test the rules and publication without downloading sources.
      - name: Run isolated Gold Spark checks
        run: /home/ubuntu/spark-env/bin/python -B final_project/tests/gold_checks.py

      # This is an offline check, not a full execution of the real-data notebook.
      - name: Check notebook syntax, input columns and configuration
        id: notebook_checks
        run: |
          /home/ubuntu/spark-env/bin/python -B final_project/tests/check_notebook.py \
            --test-run-id "$TEST_RUN_ID"

      - name: Upload offline notebook check report
        if: ${{ !cancelled() && steps.notebook_checks.outputs.run_root != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: cp2-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.notebook_checks.outputs.run_root }}/reports/
          if-no-files-found: error
          retention-days: 30
